<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Balderton BC — Preview (Member)</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}.session-card{transition:all .15s}.session-card:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}.btn-rsvp{transition:all .1s}.btn-rsvp:active{transform:scale(.97)}</style>
<script>tailwind.config={theme:{extend:{colors:{primary:'#1e3a8a','primary-light':'#eff6ff','primary-dark':'#1e40af'}}}}</script>
</head>
<body class="bg-gray-50 min-h-screen">

<div id="app" v-cloak class="max-w-3xl mx-auto p-4 md:p-6">

<header class="bg-white rounded-lg shadow-sm p-5 mb-4 flex items-center justify-between">
  <div class="flex items-center gap-3">
    <div class="w-11 h-11 bg-primary rounded-lg flex items-center justify-center text-white text-2xl">🏸</div>
    <div>
      <h1 class="text-lg font-semibold text-gray-900">Balderton Badminton Club</h1>
      <div class="text-xs text-gray-500">PREVIEW · {{ members.length }} members · Newark Leisure Centre</div>
    </div>
  </div>
  <div class="text-right">
    <label class="text-xs text-gray-500 block mb-1">I'm</label>
    <select v-model="currentMemberId" @change="localStorage.setItem('bbc_member_id', currentMemberId)" class="text-sm border border-gray-300 rounded-md px-3 py-1.5 bg-white font-medium text-gray-900 focus:outline-none focus:ring-2 focus:ring-primary">
      <option value="">— Pick name —</option>
      <option v-for="m in members" :key="m.id" :value="m.id">{{ m.name }}</option>
    </select>
  </div>
</header>

<div v-if="!currentMemberId" class="bg-primary-light border border-primary rounded-lg p-6 text-center">
  <div class="text-2xl mb-2">👋</div>
  <div class="text-primary-dark font-medium">Pick your name above to RSVP</div>
  <div class="text-xs text-gray-600 mt-2">If your name isn't there, ask Basco to add you.</div>
</div>

<template v-else>
  <div class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2 mt-5">Upcoming Sessions · {{ upcomingSessions.length }}</div>

  <div v-for="session in upcomingSessions" :key="session.id" class="session-card bg-white rounded-lg shadow-sm p-5 mb-3">
    <div class="flex items-start gap-4">
      <div class="bg-primary-light rounded-lg p-3 text-center flex-shrink-0" style="min-width: 70px;">
        <div class="text-xs text-primary font-bold uppercase tracking-wide">{{ formatDay(session.date) }}</div>
        <div class="text-2xl font-bold text-primary leading-none mt-1">{{ formatNum(session.date) }}</div>
        <div class="text-xs text-primary font-bold uppercase tracking-wide mt-1">{{ formatMonth(session.date) }}</div>
      </div>
      <div class="flex-1 min-w-0">
        <h3 class="text-base font-semibold text-gray-900 mb-1">
          {{ session.title }}
          <span v-if="isTomorrow(session.date)" class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded text-xs font-bold uppercase tracking-wide ml-2">Tomorrow</span>
        </h3>
        <div class="text-sm text-gray-600 space-y-0.5">
          <div>🕗 {{ session.time }} · {{ session.location }}</div>
          <div>👥 {{ session.max_spots }} spots · {{ getYesCount(session.id) }} / {{ session.max_spots }} attending</div>
        </div>
        <div class="flex items-center gap-2 mt-3">
          <div class="flex-1 h-1.5 bg-gray-200 rounded-full overflow-hidden">
            <div class="h-full bg-emerald-500 rounded-full" :style="{width: (getYesCount(session.id) / session.max_spots * 100) + '%'}"></div>
          </div>
          <span class="text-xs text-gray-500">{{ Math.round(getYesCount(session.id) / session.max_spots * 100) }}%</span>
        </div>
        <div class="flex gap-2 mt-4">
          <button @click="demoRsvp(session.id, 'yes')" :class="getMyStatus(session.id) === 'yes' ? 'bg-emerald-600 text-white' : 'bg-white border border-emerald-600 text-emerald-700'" class="btn-rsvp flex-1 py-2 px-3 rounded-md text-sm font-semibold">✓ I'm in</button>
          <button @click="demoRsvp(session.id, 'maybe')" :class="getMyStatus(session.id) === 'maybe' ? 'bg-amber-500 text-white' : 'bg-white border border-amber-500 text-amber-700'" class="btn-rsvp flex-1 py-2 px-3 rounded-md text-sm font-semibold">? Maybe</button>
          <button @click="demoRsvp(session.id, 'no')" :class="getMyStatus(session.id) === 'no' ? 'bg-red-600 text-white' : 'bg-white border border-red-300 text-red-700'" class="btn-rsvp flex-1 py-2 px-3 rounded-md text-sm font-semibold">✗ Can't</button>
        </div>
        <div v-if="demoToast.sessionId === session.id" class="mt-3 px-3 py-2 rounded border text-xs bg-emerald-50 text-emerald-800 border-emerald-200">✓ Demo: marked {{ demoToast.status }}</div>
      </div>
    </div>
  </div>

  <div v-if="pastSessions.length > 0">
    <div class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2 mt-6">Past Sessions · {{ pastSessions.length }}</div>
    <div v-for="session in pastSessions.slice(0, 4)" :key="session.id" class="bg-white rounded-lg shadow-sm p-4 mb-2 opacity-70">
      <div class="flex items-center justify-between">
        <div>
          <div class="text-sm font-medium text-gray-700">{{ formatFullDate(session.date) }} · {{ session.title }}</div>
          <div class="text-xs text-gray-500 mt-1">{{ getYesCount(session.id) }} attended · {{ getNoCount(session.id) }} declined · {{ getMaybeCount(session.id) }} maybe</div>
        </div>
        <div v-if="getMyStatus(session.id)" class="text-xs px-2 py-1 rounded font-semibold" :class="getMyStatus(session.id) === 'yes' ? 'bg-emerald-100 text-emerald-700' : getMyStatus(session.id) === 'no' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'">You: {{ getMyStatus(session.id) }}</div>
      </div>
    </div>
  </div>
</template>

<footer class="text-center text-xs text-gray-400 mt-8 mb-4">PREVIEW MODE · Mock data · {{ members.length }} members loaded</footer>
</div>

<script src="mock-data.js"></script>
<script>
const { createApp, ref, computed, onMounted } = Vue;
createApp({
  setup() {
    const members = ref(window.MOCK_DATA.members);
    const sessions = ref(window.MOCK_DATA.sessions);
    const attendance = ref(window.MOCK_DATA.attendance);
    const currentMemberId = ref(localStorage.getItem('bbc_member_id') || '');
    const demoToast = ref({ sessionId: null, status: '' });

    const upcomingSessions = computed(() => {
      const today = '2026-09-14';
      return sessions.value.filter(s => s.date >= today).sort((a, b) => a.date.localeCompare(b.date));
    });
    const pastSessions = computed(() => {
      const today = '2026-09-14';
      return sessions.value.filter(s => s.date < today).sort((a, b) => b.date.localeCompare(a.date));
    });

    function getYesCount(id) { return attendance.value.filter(a => a.session_id === id && a.status === 'yes').length; }
    function getNoCount(id) { return attendance.value.filter(a => a.session_id === id && a.status === 'no').length; }
    function getMaybeCount(id) { return attendance.value.filter(a => a.session_id === id && a.status === 'maybe').length; }
    function getMyStatus(id) {
      const a = attendance.value.find(x => x.member_id === currentMemberId.value && x.session_id === id);
      return a ? a.status : null;
    }
    function formatDay(d) { return new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'short' }); }
    function formatNum(d) { return new Date(d + 'T00:00:00').getDate(); }
    function formatMonth(d) { return new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { month: 'short' }); }
    function formatFullDate(d) { return new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); }
    function isTomorrow(d) { return d === '2026-09-15'; }
    function demoRsvp(sessionId, status) {
      // Update local mock
      const existing = attendance.value.findIndex(x => x.member_id === currentMemberId.value && x.session_id === sessionId);
      if (existing >= 0) attendance.value[existing].status = status;
      else attendance.value.push({ member_id: currentMemberId.value, session_id: sessionId, status: status, updated_at: new Date().toISOString() });
      demoToast.value = { sessionId, status };
      setTimeout(() => { if (demoToast.value.sessionId === sessionId) demoToast.value = { sessionId: null, status: '' }; }, 2000);
    }
    return { members, currentMemberId, upcomingSessions, pastSessions, demoToast,
      getYesCount, getNoCount, getMaybeCount, getMyStatus, formatDay, formatNum, formatMonth, formatFullDate, isTomorrow, demoRsvp };
  }
}).mount('#app');
</script>
</body>
</html>
